apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coder

resources:
  - namespace.yaml
  - gitrepository.yaml
  - secret.sops.yaml
  - certificate.yaml
  - provisioner-rbac.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: coder-values
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true
