apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: homepage-values
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true
