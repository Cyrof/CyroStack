image:
  repository: ghcr.io/gethomepage/homepage
  tag: v1.13.1

enableRbac: true

serviceAccount:
  create: true
  name: homepage

service:
  main:
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: true
    ingressClassName: traefik
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Homepage
      gethomepage.dev/group: Cluster
      gethomepage.dev/description: CyroStack internal dashboard
      gethomepage.dev/icon: homepage.png
    hosts:
      - host: homepage.cyrostack.arpa
        paths:
          - path: /
            pathType: Prefix

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homepage.cyrostack.arpa

config:
  services:
    - Public / External:
        - Cloudflare:
            icon: cloudflare.png
            href: https://dash.cloudflare.com
            description: Cloudflare dashboard

        - Porkbun:
            icon: mdi-pig
            href: https://porkbun.com/account/login
            description: Domain registrar

    - CyroStack Apps:
        - OurNeZt:
            icon: mdi-home-city
            href: https://ournezt.cyrostack.dev
            description: Housing calculator

        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vault.cyrostack.dev
            description: Password manager

        - GopherGate:
            icon: mdi-gate
            href: https://gophergate.cyrostack.dev
            description: Remote access / gateway

    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: https://grafana.cyrostack.arpa:32080
            description: Dashboards and metrics
            namespace: monitoring
            app: grafana

        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.cyrostack.arpa:32080
            description: Metrics backend
            namespace: monitoring
            app: prometheus

    - Cluster / GitOps:
        - Weave GitOps:
            icon: weave-gitops.png
            href: https://gitops.cyrostack.arpa:32080
            description: Flux GitOps dashboard

    - Home Network:
        - Pi-hole:
            icon: pi-hole.png
            href: http://pihole.cyrostack.arpa/admin
            description: DNS and ad blocking

        - OpenMediaVault:
            icon: openmediavault.png
            href: http://omv.cyrostack.arpa
            description: NAS management

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: CyroStack
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default

    - search:
        provider: duckduckgo
        target: _blank

  docker: {}
