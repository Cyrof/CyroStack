apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  instances: 1

  storage:
    storageClass: nfs-csi
    size: 5Gi

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.4-1.1.1

  postgresql:
    shared_preload_libraries:
      - "vchord.so"

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-database
  namespace: immich
spec:
  name: app
  owner: app

  cluster:
    name: immich-database

  extensions:
    - name: vector
      ensure: present

    - name: vchord
      ensure: present

    - name: earthdistance
      ensure: present

    - name: cube
      ensure: present
