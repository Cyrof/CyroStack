apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - database.yaml
  - ocirepository.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: immich-values
    namespace: immich
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
