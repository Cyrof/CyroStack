controllers:
  main:
    containers:
      main:
        image:
          tag: v3.1.0

server:
  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: host

            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: user

            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: password

            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-database-app
                  key: dbname

  ingress:
    main:
      enabled: true
      ingressClassName: traefik
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Immich
        gethomepage.dev/group: Media
        gethomepage.dev/description: CyroStack photo library
        gethomepage.dev/icon: immich.png

      hosts:
        - host: immich.cyrostack.arpa
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main

valkey:
  enabled: true

immich:
  persistence:
    library:
      existingClaim: immich-library-pvc
