nameOverride: ""
fullnameOverride: "knfolio"

image:
  repository: ghcr.io/cyrof/kn-folio
  tag: v0.2.1
  pullPolicy: Always

replicaCount: 2

service:
  name: knfolio-service
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  host: knfolio.cyrostack.dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
  tls:
    enabled: true
    secretName: knfolio-tls

existingSecret:
  enabled: true
  name: knfolio-resend-secrets
