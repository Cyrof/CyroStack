apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  interval: 30m

  chart:
    spec:
      chart: app-template
      version: "4.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      interval: 1h

  valuesFrom:
    - kind: ConfigMap
      name: flaresolverr-values
      valuesKey: values.yaml