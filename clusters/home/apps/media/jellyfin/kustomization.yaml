apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

resources:
  - helmrepository.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: jellyfin-values
    namespace: media
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled