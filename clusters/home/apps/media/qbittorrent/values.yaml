controllers:
  main:
    strategy: Recreate

    containers:
      main:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: latest
          pullPolicy: Always

        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Asia/Singapore

          WEBUI_PORT: "8080"
          TORRENTING_PORT: "6881"

          UMASK: "002"

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 768Mi

service:
  main:
    controller: main
    type: ClusterIP

    ports:
      http:
        port: 8080
        protocol: HTTP

ingress:
  main:
    enabled: true
    className: traefik

    hosts:
      - host: qbittorrent.cyrostack.arpa
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: nfs-csi
    accessMode: ReadWriteOnce
    size: 1Gi
    retain: true

    globalMounts:
      - path: /config

  media:
    type: persistentVolumeClaim
    existingClaim: media-data

    globalMounts:
      - path: /media