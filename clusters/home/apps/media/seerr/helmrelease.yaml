apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 30m
  timeout: 10m

  chartRef:
    kind: OCIRepository
    name: seerr
    namespace: media

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: seerr-values
      valuesKey: values.yaml