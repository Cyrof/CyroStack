apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: "25.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: prometheus-scrape-configs
      valuesKey: values.yaml

  values:
    alertmanager:
      enabled: false

    pushgateway:
      enabled: false

    kube-state-metrics:
      enabled: true

    prometheus-node-exporter:
      enabled: true

    server:
      persistentVolume:
        enabled: true
        existingClaim: prometheus-server-nfs
        size: 20Gi

      retention: 7d

      # keep lightweight for rasp pi
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      service:
        type: ClusterIP
        servicePort: 9090

      ingress:
        enabled: true
        ingressClassName: traefik
        annotations: {}
        hosts:
          - prometheus.cyrostack.arpa
        path: /
        pathType: Prefix
