apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      version: "25.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    alertmanager:
      enabled: false

    pushgateway:
      enabled: false

    kube-state-metrics:
      enabled: true

    prometheus-node-exporter:
      enabled: true

    server:
      # Use default StorageClass
      persistentVolume:
        enabled: true
        size: 10Gi

      retention: 7d

      # keep lightweight for rasp pi
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      service:
        type: ClusterIP
        servicePort: 9090

      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        hosts:
          - prometheus.cyrostack.arpa
        path: /
        pathType: Prefix

      extraScrapeConfigs: |
        - job_name: "blackbox-vaultwarden"
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets:
        - http://vaultwarden-web.vaultwarden.svc.cluster.local:80/
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
