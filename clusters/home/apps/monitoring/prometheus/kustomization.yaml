apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - pvc-nfs.yaml

configMapGenerator:
  - name: prometheus-scrape-configs
    files:
      - values.yaml=scrape-configs.yaml

generatorOptions:
  disableNameSuffixHash: false

configurations:
  - kustomizeconfig.yaml
