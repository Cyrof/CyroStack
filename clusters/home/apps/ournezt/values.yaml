fullnameOverride: ournezt

global:
  appEnv: production

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-bookworm
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  auth:
    database: ournezt
    username: ournezt
    existingSecret: ournezt-db-credentials
    passwordKey: POSTGRES_PASSWORD
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

core:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ournezt/ournezt-core
    tag: v2.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50051
  grpcAddr: ":50051"
  # Preserve the existing trusted in-cluster plaintext hop for this upgrade.
  allowInsecure: true
  tls:
    enabled: false
  databaseURL: ""
  sessionTokenBytes: 32
  sessionTTL: 12h
  runMigrations: "true"
  authLimits:
    ipLimit: 120
    accountLimit: 5
    rateWindow: 1m
    maxConcurrent: 2
  bootstrap:
    # Existing installation: do not re-run one-time administrator bootstrap.
    enabled: false
    adminEmail: "admin@ournezt.local"
    adminDisplayName: "Bootstrap Admin"
    existingSecret: "ournezt-bootstrap-admin"
    passwordKey: BOOTSTRAP_ADMIN_PASSWORD
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/ournezt/ournezt-web
    # Stage 1: keep Web on v1.4.0 until Core v2 migration/readiness is verified.
    # Stage 2: set this to v2.0.0 after Core migration/readiness is verified.
    tag: v1.4.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  webAddr: ":8080"
  requestTimeout: 5s
  shutdownTimeout: 10s
  httpLimits:
    readHeaderTimeout: 10s
    readTimeout: 15s
    writeTimeout: 30s
    idleTimeout: 60s
    maxRequestBodyBytes: 1048576
  csrf:
    existingSecret: ournezt-web-csrf
    key: CSRF_AUTH_KEY
  coreAllowInsecure: true
  coreGrpcTLS:
    enabled: false
    insecureSkipVerify: "false"
  authLimits:
    ipLimit: 30
    accountLimit: 5
    rateWindow: 1m
    maxConcurrent: 8
  # Add actual Traefik source IPs/CIDRs here when known.
  # Empty means users behind Traefik share its IP throttle budget.
  trustedProxies: 
    - "10.42.6.18/32"
    - "10.42.2.141/32"
  sessionCookieName: ournezt_session
  sessionCookieMaxAge: 12h
  sessionCookieSecure: "true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  ingress:
    enabled: true
    className: traefik
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: letsencrypt-http01
      traefik.ingress.kubernetes.io/router.middlewares: ournezt-ournezt-security-headers@kubernetescrd
    hosts:
      - host: ournezt.cyrostack.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ournezt-tls
        hosts:
          - ournezt.cyrostack.dev
  maintenanceNotice:
    enabled: true
    level: warning
    title: Scheduled maintenance - New Release Deployment
    message: >-
      OurNeZt will undergo scheduled maintenance on 13 November 2026,
      from 2:00 PM to approximately 4:00 PM SGT for the deployment of
      new Web and Core releases, including security enhancements,
      bug fixes, and stability improvements.
      The service may be temporarily unavailable during this period.
      We apologize for any inconvenience caused.
    startsAt: 13 Nov 2026, 2:00 PM SGT
    endsAt: 13 Nov 2026, approximately 4:00 PM SGT
    mountPath: /etc/ournezt/maintenance-notice
    fileName: notice.json

podSecurityContext:
  fsGroup: 999

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true

nodeSelector: {}

tolerations: []

affinity: {}
