apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-size-exporter
  namespace: vaultwarden
data:
  exporter.py: |
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    DATA_DIR = "/data"

    def get_size():
        total = 0
        for root, dirs, files in os.walk(DATA_DIR):
            for f in files:
                try:
                    total += os.path.getsize(os.path.join(root, f))
                except:
                    pass
        return total

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404)
                self.end_headers()
                return

            size = get_size()

            metrics = (
                "# HELP vaultwarden_data_size_bytes Actual size of vaultwarden /data directory\n"
                "# TYPE vaultwarden_data_size_bytes gauge\n"
                f"vaultwarden_data_size_bytes {size}\n"
            )

            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(metrics.encode())

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 9108), Handler).serve_forever()
