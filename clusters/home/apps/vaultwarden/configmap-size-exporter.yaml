apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-size-exporter
  namespace: vaultwarden
data:
  size_exporter.py: |
    import os
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    DATA_DIR = "/data"
    PORT = 9108

    def get_dir_size_bytes(path: str) -> int:
        total = 0
        for root, dirs, files in os.walk(path):
            for name in files:
                fp = os.path.join(root, name)
                try:
                    if not os.path.islink(fp):
                        total += os.path.getsize(fp)
                except FileNotFoundError:
                    pass
        return total

    def get_file_size(path: str) -> int:
        try:
            return os.path.getsize(path)
        except FileNotFoundError:
            return 0

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404)
                self.end_headers()
                return

            total = get_dir_size_bytes(DATA_DIR)
            db = get_file_size(os.path.join(DATA_DIR, "db.sqlite3"))
            wal = get_file_size(os.path.join(DATA_DIR, "db.sqlite3-wal"))
            shm = get_file_size(os.path.join(DATA_DIR, "db.sqlite3-shm"))

            payload = f"""# HELP vaultwarden_data_size_bytes Total size of /data used by Vaultwarden in bytes
# TYPE vaultwarden_data_size_bytes gauge
vaultwarden_data_size_bytes {total}
# HELP vaultwarden_db_sqlite_size_bytes Size of db.sqlite3 in bytes
# TYPE vaultwarden_db_sqlite_size_bytes gauge
vaultwarden_db_sqlite_size_bytes {db}
# HELP vaultwarden_db_wal_size_bytes Size of db.sqlite3-wal in bytes
# TYPE vaultwarden_db_wal_size_bytes gauge
vaultwarden_db_wal_size_bytes {wal}
# HELP vaultwarden_db_shm_size_bytes Size of db.sqlite3-shm in bytes
# TYPE vaultwarden_db_shm_size_bytes gauge
vaultwarden_db_shm_size_bytes {shm}
"""

            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload.encode("utf-8"))

        def log_message(self, format, *args):
            return

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", PORT), Handler)
        server.serve_forever()
