apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 30m
  chart:
    spec:
      chart: vaultwarden
      version: ">=0.0.0"
      sourceRef:
        kind: HelmRepository
        name: pascaliske
        namespace: flux-system
      interval: 1h
  values:
    env:
      - name: TZ
        value: Asia/Singapore

      - name: DOMAIN
        value: "https://vault.knfolio.dev"

      - name: SIGNUPS_ALLOWED
        value: "true"

      - name: INVITATIONS_ALLOWED
        value: "true"

      - name: WEBSOCKET_ENABLED
        value: "true"

    secret:
      create: false
      existingSecret: vaultwarden-secret

    persistentVolumeClaim:
      create: true
      size: 1Gi
      storageClassName: ""
      mountPath: /data

    service:
      type: ClusterIP
