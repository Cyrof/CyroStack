apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrelease.yaml
  - secret.sops.yaml

configMapGenerator:
  - name: wakeonlan-values
    namespace: flux-system
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

