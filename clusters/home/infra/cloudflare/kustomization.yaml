apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrepository.yaml
  - secret.sops.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: cloudflare-tunnel-values
    namespace: cloudflare
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true
