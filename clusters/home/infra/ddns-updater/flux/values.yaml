namespace:
  create: false
  name: cyro-ddns

image:
  repository: cyrof/porkbun-ddns
  tag: latest
  pullPolicy: IfNotPresent

cronjob:
  timeZone: "Asia/Singapore"
  concurrencyPolicy: "Forbid"
  startingDeadlineSeconds: 60
  activeDeadlineSeconds: 60
  backoffLimit: 1
  restartPolicy: "Never"
  suspend: false

jobs:
