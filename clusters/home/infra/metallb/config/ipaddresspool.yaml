apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: home-lan-pool
  namespace: metallb-system
  spec:
    addresses:
      - 192.168.70.240-192.168.70.250

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: home-lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - home-lan-pool
