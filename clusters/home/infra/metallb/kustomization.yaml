apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - ipaddresspool.yaml

configMapGenerator:
  - name: metallb-values
    namespace: metallb-system
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true
