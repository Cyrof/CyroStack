apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - storageclass.yaml

configMapGenerator:
  - name: csi-driver-nfs-values
    namespace: nfs-csi
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true
