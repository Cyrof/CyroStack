apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrelease.yaml
  - secret-main.sops.yaml
  - secret-vault.sops.yaml
  - secret-vpn.sops.yaml

configMapGenerator:
  - name: cyro-ddns-values
    files:
      - values.yaml=values.yaml

generatorOptions:
  disableNameSuffixHash: true
