apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: 
  name: rancher
  namespace: flux-system
spec:
  interval: 30m
  path: ./clusters/home/infra/rancher
  prune: true
  wait: true
  timeout: 15m

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: cert-manager-issuer