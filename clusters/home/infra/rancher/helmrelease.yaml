apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: cattle-system
spec:
  interval: 30m
  timeout: 15m

  chart:
    spec:
      chart: rancher
      version: "2.14.3"
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
        namespace: cattle-system
      interval: 1h

  install:
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    hostname: rancher.cyrostack.dev

    replicas: 1

    ingress:
      enabled: true
      ingressClassName: traefik

      tls:
        source: secret 
        secretName: tls-rancher-ingress

    tls: ingress 

    agentTLSMode: strict

    resources:
      requests:
        cpu: 250m
        memory: 512Mi